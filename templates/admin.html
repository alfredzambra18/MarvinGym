<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Marvin Gym</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #121212; color: #fff; padding: 20px; max-width: 1100px; margin: 0 auto; }
        h1 { color: #ffcc00; margin-bottom: 20px; }
        
        /* TARJETAS DE ESTADÍSTICAS */
        .stats { display: flex; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #1e1e1e; padding: 15px; border-radius: 8px; flex: 1; border-left: 4px solid #ffcc00; }
        .stat-card.gastos { border-left-color: #ff4444; }
        .stat-card.neto { border-left-color: #00c851; }
        .stat-card h3 { font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        .stat-card p { font-size: 1.4rem; font-weight: bold; }
        
        /* SECCIONES Y FORMULARIOS */
        .grid-forms { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #2a2a2a; }
        .box h2 { color: #ffcc00; font-size: 1.1rem; margin-bottom: 15px; }
        
        label { display: block; font-size: 0.85rem; color: #ccc; margin-top: 10px; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
        button.btn-submit { width: 100%; margin-top: 15px; padding: 10px; background: #ffcc00; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        button.btn-submit:hover { background: #e6b800; }
        
        /* TABLA DE SOCIOS */
        .header-tabla { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        input#buscar { max-width: 300px; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #2a2a2a; }
        th { background: #2a2a2a; color: #ffcc00; }
        
        /* ALERTAS POR COLOR EN LA TABLA */
        tr.alerta-por-vencer { background-color: #5c4d00 !important; color: #fff; } /* Amarillo/Dorado */
        tr.alerta-vencido { background-color: #5c1414 !important; color: #fff; }   /* Rojo */
        
        .btn-ws { background: #25d366; color: #000; padding: 6px 10px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 0.8rem; display: inline-block; }
        .btn-renew { background: #ffcc00; color: #000; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>
    <h1>Panel de Control de Gimnasio ⚡</h1>
    
    <!-- RESUMEN FINANCIERO Y SOCIOS -->
    <div class="stats">
        <div class="stat-card">
            <h3>Total Socios Activos</h3>
            <p id="total-socios">0</p>
        </div>
        <div class="stat-card">
            <h3>Ingresos (Bruto)</h3>
            <p id="total-ingresos">$0</p>
        </div>
        <div class="stat-card gastos">
            <h3>Gastos Registrados</h3>
            <p id="total-gastos">$0</p>
        </div>
        <div class="stat-card neto">
            <h3>Ganancia Neta</h3>
            <p id="total-neto">$0</p>
        </div>
    </div>

    <!-- ACCIONES RÁPIDAS (FORMULARIOS) -->
    <div class="grid-forms">
        <!-- 1. Inscripción Presencial Directa -->
        <div class="box">
            <h2>📝 Planilla de Inscripción Directa</h2>
            <form id="form-inscripcion">
                <label>Nombre Completo:</label>
                <input type="text" id="ins-nombre" placeholder="Ej: Carlos Pérez" required>
                
                <label>Teléfono (WhatsApp):</label>
                <input type="tel" id="ins-telefono" placeholder="Ej: 584121234567" required>
                
                <label>Plan:</label>
                <select id="ins-plan">
                    <option value="Mensual">Mensual ($25)</option>
                    <option value="Trimestral">Trimestral ($65)</option>
                </select>
                
                <button type="submit" class="btn-submit">Registrar Socio</button>
            </form>
        </div>

        <!-- 2. Registro de Gastos -->
        <div class="box">
            <h2>💸 Registrar Gasto del Gimnasio</h2>
            <form id="form-gasto">
                <label>Concepto / Descripción:</label>
                <input type="text" id="gasto-concepto" placeholder="Ej: Reparación de polea, Pago de luz" required>
                
                <label>Monto ($):</label>
                <input type="number" step="0.01" id="gasto-monto" placeholder="Ej: 15.00" required>
                
                <button type="submit" class="btn-submit" style="background: #ff4444; color: #fff;">Anotar Gasto</button>
            </form>
        </div>
    </div>

    <!-- CONTROL Y TABLA DE SOCIOS -->
    <div class="header-tabla">
        <h2>Control de Socios y Recordatorios</h2>
        <input type="text" id="buscar" onkeyup="filtrarTabla()" placeholder="🔍 Buscar socio por nombre...">
    </div>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Plan</th>
                <th>Inscrito</th>
                <th>Vence</th>
                <th>Acción de Cobro</th>
                <th>Renovar Plan</th>
            </tr>
        </thead>
        <tbody id="tabla-socios">
        </tbody>
    </table>

    <script>
        let sociosGlobales = [];

        async function cargarDatos() {
            // Cargar Socios
            const resSocios = await fetch('/api/socios');
            sociosGlobales = await resSocios.json();
            
            // Cargar Gastos
            const resGastos = await fetch('/api/gastos');
            const gastos = await resGastos.json();

            renderTabla(sociosGlobales);
            calcularFinanzas(sociosGlobales, gastos);
        }

        function renderTabla(socios) {
            const tbody = document.getElementById('tabla-socios');
            tbody.innerHTML = '';
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);

            socios.forEach(s => {
                const fechaVenc = new Date(s.fecha_vencimiento + 'T00:00:00');
                const diffTiempo = fechaVenc - hoy;
                const diffDias = Math.ceil(diffTiempo / (1000 * 60 * 60 * 24));

                let claseFila = "";
                if (diffDias < 0) {
                    claseFila = "alerta-vencido";      // Rojo si ya venció
                } else if (diffDias <= 3) {
                    claseFila = "alerta-por-vencer";  // Amarillo si quedan <= 3 días
                }

                const msgCobro = encodeURIComponent(`Hola ${s.nombre}, te saludamos de Marvin Gym ⚡. Te recordamos que tu plan (${s.plan}) vence el ${s.fecha_vencimiento}. ¡Te esperamos para renovar!`);
                const urlWhatsApp = `https://wa.me/${s.telefono}?text=${msgCobro}`;

                const fila = document.createElement('tr');
                fila.className = claseFila;
                fila.innerHTML = `
                    <td><strong>${s.nombre}</strong></td>
                    <td>${s.telefono}</td>
                    <td>${s.plan}</td>
                    <td>${s.fecha_registro}</td>
                    <td><strong>${s.fecha_vencimiento}</strong></td>
                    <td><a href="${urlWhatsApp}" target="_blank" class="btn-ws">📩 Recordatorio</a></td>
                    <td><button onclick="renovarSocio(${s.id})" class="btn-renew">🔄 Renovar 1 Mes</button></td>
                `;
                tbody.appendChild(fila);
            });
        }

        function calcularFinanzas(socios, gastos) {
            let ingresos = socios.reduce((sum, s) => sum + s.monto, 0);
            let totalGastos = gastos.reduce((sum, g) => sum + g.monto, 0);
            let neto = ingresos - totalGastos;

            document.getElementById('total-socios').innerText = socios.length;
            document.getElementById('total-ingresos').innerText = `$${ingresos.toFixed(2)}`;
            document.getElementById('total-gastos').innerText = `$${totalGastos.toFixed(2)}`;
            document.getElementById('total-neto').innerText = `$${neto.toFixed(2)}`;
        }

        function filtrarTabla() {
            const busqueda = document.getElementById('buscar').value.toLowerCase();
            const filtrados = sociosGlobales.filter(s => s.nombre.toLowerCase().includes(busqueda));
            renderTabla(filtrados);
        }

        // Evento Inscripción Directa
        document.getElementById('form-inscripcion').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('ins-nombre').value,
                telefono: document.getElementById('ins-telefono').value,
                plan: document.getElementById('ins-plan').value
            };

            await fetch('/api/inscribir', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            document.getElementById('form-inscripcion').reset();
            cargarDatos();
        };

        // Evento Registro de Gasto
        document.getElementById('form-gasto').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                concepto: document.getElementById('gasto-concepto').value,
                monto: parseFloat(document.getElementById('gasto-monto').value)
            };

            await fetch('/api/gasto', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            document.getElementById('form-gasto').reset();
            cargarDatos();
        };

        async function renovarSocio(id) {
            if(confirm('¿Confirmar que el socio pagó la renovación de un mes?')) {
                await fetch(`/api/renovar/${id}`, { method: 'POST' });
                cargarDatos();
            }
        }

        cargarDatos();
    </script>
</body>
</html>
