<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morosos - Marvin Gym</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e5e5e5; padding: 20px; max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #222; margin-bottom: 24px; flex-wrap: wrap; }
        .header-title { color: #facc15; font-size: 20px; font-weight: 700; }
        .btn-back { color: #888; text-decoration: none; font-size: 14px; }
        .btn-back:hover { color: #fff; }
        .card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card-title { color: #facc15; font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #1a1a1a; }
        th { color: #facc15; font-size: 11px; text-transform: uppercase; }
        .vencido { color: #ef4444; font-weight: 600; }
        .alert-success { background: #064e3b; color: #6ee7b7; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; text-align: center; border: 1px solid #065f46; }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .header { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">Morosos</div>
        <a href="{{ url_for('admin_dashboard') }}" class="btn-back">← Volver</a>
    </div>

    <div class="card">
        <div class="card-title">Socios con Membresia Vencida</div>
        {% if morosos %}
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Cedula</th>
                    <th>Telefono</th>
                    <th>Vence</th>
                </tr>
            </thead>
            <tbody>
                {% for socio in morosos %}
                <tr>
                    <td>{{ socio[1] }}</td>
                    <td>{{ socio[2] }}</td>
                    <td>{{ socio[3] }}</td>
                    <td class="vencido">{{ socio[4] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="alert-success">No hay socios con membresia vencida</div>
        {% endif %}
    </div>
</body>
</html>
