<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones - Marvin Gym</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative; }
        .brand-logo { position: absolute; top: 15px; right: 20px; font-weight: 800; font-size: 14px; color: #38bdf8; letter-spacing: 1.5px; opacity: 0.8; text-transform: uppercase; }
        .card { background-color: #111827; border-radius: 16px; border: 1px solid #1e293b; padding: 30px; max-width: 420px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7); }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 5px; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; }
        p.sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; font-weight: 600; }
        .pm-box { background-color: #0b0f19; border: 1px solid #0284c7; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .pm-title { color: #38bdf8; font-weight: bold; font-size: 14px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .pm-row { font-size: 14px; margin-bottom: 4px; color: #cbd5e1; }
        .pm-row strong { color: #ffffff; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-top: 12px; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; background-color: #0b0f19; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        button { width: 100%; background-color: #0284c7; color: #ffffff; font-weight: bold; border: none; padding: 14px; border-radius: 8px; font-size: 15px; margin-top: 20px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
        .alert-success { background-color: #064e3b; color: #34d399; border: 1px solid #059669; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="brand-logo">xp_afx</div>
    <div class="card">
        <h1>MARVIN GYM</h1>
        <p class="sub">Sistema de Verificación de Pagos</p>

        {% if enviado %}
        <div class="alert-success">
            ¡Pago enviado con éxito! Tu acceso será verificado a la brevedad.
        </div>
        {% endif %}

        <div class="pm-box">
            <div class="pm-title">Datos de Pago Móvil:</div>
            <div class="pm-row"><strong>Banco:</strong> {{ pago_movil.banco }}</div>
            <div class="pm-row"><strong>Cédula:</strong> {{ pago_movil.cedula }}</div>
            <div class="pm-row"><strong>Teléfono:</strong> {{ pago_movil.telefono }}</div>
        </div>

        <form action="/reportar_pago" method="POST" enctype="multipart/form-data">
            <label for="nombre">Nombre y Apellido</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Alfredo Zambrano" required>

            <label for="cedula">Cédula de Identidad</label>
            <input type="text" id="cedula" name="cedula" placeholder="Ej: 13210442" required>

            <label for="telefono">Número de WhatsApp</label>
            <input type="text" id="telefono" name="telefono" placeholder="Ej: 04123931166" required>

            <label for="tipo_plan">Plan a Cancelar</label>
            <select id="tipo_plan" name="tipo_plan" required>
                <option value="Mensualidad">Mensualidad ($10)</option>
                <option value="Pase Diario">Pase Diario ($1)</option>
            </select>

            <label for="referencia">Número de Referencia</label>
            <input type="text" id="referencia" name="referencia" placeholder="Ej: 849201" required>

            <label for="comprobante">Comprobante (Captura o Foto)</label>
            <input type="file" id="comprobante" name="comprobante" accept="image/*" required>

            <button type="submit">Reportar Pago</button>
        </form>
    </div>
</body>
</html>
