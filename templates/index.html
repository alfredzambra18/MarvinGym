<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones - Marvin Gym</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Impact', 'Arial Black', sans-serif; background-color: #050505 !important; color: #ffffff !important; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative; }
        .brand-logo { position: absolute; top: 15px; right: 20px; font-family: sans-serif; font-weight: 800; font-size: 13px; color: #facc15; letter-spacing: 1.5px; opacity: 0.8; text-transform: lowercase; }
        .card { background-color: #121212 !important; border-radius: 16px; border: 2px solid #facc15; padding: 30px; max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(250, 204, 21, 0.15); text-align: center; }
        .logo-img { width: 140px; height: auto; margin-bottom: 10px; border-radius: 50%; border: 3px solid #facc15; }
        h1 { color: #ffffff !important; margin-bottom: 2px; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
        h1 span { color: #facc15; }
        p.sub { font-family: sans-serif; color: #a1a1aa; font-size: 13px; margin-bottom: 20px; font-weight: 600; text-transform: uppercase; }
        .pm-box { font-family: sans-serif; background-color: #000000 !important; border: 1px dashed #facc15; border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .pm-title { color: #facc15; font-weight: bold; font-size: 14px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .pm-row { font-size: 14px; margin-bottom: 4px; color: #e4e4e7; }
        .pm-row strong { color: #ffffff; }
        label { font-family: sans-serif; display: block; font-size: 11px; color: #facc15; margin-top: 12px; margin-bottom: 4px; text-transform: uppercase; font-weight: 700; text-align: left; }
        input, select { font-family: sans-serif; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #27272a; background-color: #000000 !important; color: #fff !important; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #facc15; }
        button { font-family: 'Impact', 'Arial Black', sans-serif; width: 100%; background-color: #facc15 !important; color: #000000 !important; border: none; padding: 14px; border-radius: 8px; font-size: 18px; margin-top: 20px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s, background 0.2s; }
        button:hover { background-color: #eab308 !important; transform: scale(1.02); }
        .alert-success { font-family: sans-serif; background-color: #14532d; color: #4ade80; border: 1px solid #22c55e; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="brand-logo">xp_afx</div>
    <div class="card">
        <img src="/static/logo.png" alt="Marvin Gym Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>MARVIN <span>GYM</span></h1>
        <p class="sub">Reporte de Pago en Línea</p>

        {% if enviado %}
        <div class="alert-success">
            ¡Pago enviado con éxito! Tu acceso será verificado a la brevedad.
        </div>
        {% endif %}

        <div class="pm-box">
            <div class="pm-title">Datos de Pago Móvil:</div>
            <div class="pm-row"><strong>Banco:</strong> {{ pago_movil.banco }}</div>
            <div class="pm-row"><strong>Cédula:</strong> {{ pago_movil.cedula }}</div>
            <div class="pm-row"><strong>Teléfono:</strong> {{ pago_movil.telefono }}</div>
        </div>

        <form action="/reportar_pago" method="POST" enctype="multipart/form-data">
            <label for="nombre">Nombre y Apellido</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Alfredo Zambrano" required>

            <label for="cedula">Cédula de Identidad</label>
            <input type="text" id="cedula" name="cedula" placeholder="Ej: 13210442" required>

            <label for="telefono">Número de WhatsApp</label>
            <input type="text" id="telefono" name="telefono" placeholder="Ej: 04123931166" required>

            <label for="tipo_plan">Plan a Cancelar</label>
            <select id="tipo_plan" name="tipo_plan" required>
                <option value="Mensualidad">Mensualidad ($10)</option>
                <option value="Pase Diario">Pase Diario ($1)</option>
            </select>

            <label for="referencia">Número de Referencia</label>
            <input type="text" id="referencia" name="referencia" placeholder="Ej: 849201" required>

            <label for="comprobante">Comprobante (Captura o Foto)</label>
            <input type="file" id="comprobante" name="comprobante" accept="image/*" required>

            <button type="submit">Reportar Pago</button>
        </form>
    </div>
</body>
</html>
