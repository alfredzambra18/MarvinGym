<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Marvin Gym</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #050505; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #121212; border: 2px solid #facc15; padding: 30px; border-radius: 16px; max-width: 380px; width: 100%; text-align: center; }
        h1 { color: #facc15; margin-bottom: 20px; font-size: 26px; text-transform: uppercase; }
        label { display: block; text-align: left; font-size: 12px; color: #facc15; margin-top: 12px; margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #27272a; background: #000; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #facc15; }
        button { width: 100%; background: #facc15; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #eab308; }
        a { color: #a1a1aa; font-size: 13px; text-decoration: none; display: block; margin-top: 15px; }
        a:hover { color: #facc15; }
        .alert { background: #3f3f46; color: #facc15; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Marvin <span>Gym</span></h1>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <label>Cédula</label>
            <input type="text" name="cedula" placeholder="Ej: 13210442" required>
            <label>Contraseña</label>
            <input type="password" name="password" required>
            <button type="submit">Ingresar</button>
        </form>
        <a href="/registro">¿No tienes cuenta? Regístrate aquí</a>
    </div>
</body>
</html>
