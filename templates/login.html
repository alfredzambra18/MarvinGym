<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Marvin Gym</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #121212; border: 1px solid #facc15; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(250, 204, 21, 0.15); }
        h1 { color: #facc15; text-align: center; text-transform: uppercase; font-size: 24px; margin-bottom: 20px; letter-spacing: 1px; }
        .alert { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #a1a1aa; text-transform: uppercase; margin-bottom: 6px; font-weight: bold; }
        input { width: 100%; padding: 12px; background: #18181b; border: 1px solid #27272a; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #facc15; }
        .btn { width: 100%; padding: 12px; background: #facc15; border: none; border-radius: 6px; color: #000; font-weight: bold; text-transform: uppercase; cursor: pointer; font-size: 14px; margin-top: 10px; }
        .btn:hover { background: #eab308; }
        .link { text-align: center; margin-top: 20px; font-size: 13px; color: #a1a1aa; }
        .link a { color: #facc15; text-decoration: none; font-weight: bold; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Marvin Gym</h1>
        <p style="text-align: center; color: #a1a1aa; font-size: 13px; margin-bottom: 20px;">Portal de Socios</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Cédula de Identidad</label>
                <input type="text" name="cedula" placeholder="Ej: 28123456" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Ingresar al Portal</button>
        </form>

        <div class="link">
            ¿Aún no tienes cuenta? <a href="/registro">Regístrate aquí</a>
        </div>
    </div>
</body>
</html>
