<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MarvinGym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .login-card {
            background: #181818;
            border: 2px solid #ffed00;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 237, 0, 0.25);
        }
        .brand-title {
            color: #ffffff;
            font-weight: 900;
            letter-spacing: 1.5px;
        }
        .brand-yellow {
            color: #ffed00;
        }
        .btn-yellow {
            background-color: #ffed00;
            color: #0d0d0d;
            font-weight: 800;
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .btn-yellow:hover {
            background-color: #e6d500;
            color: #0d0d0d;
            box-shadow: 0 0 12px rgba(255, 237, 0, 0.4);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
    <div class="card login-card p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <span class="badge bg-dark text-warning border border-warning mb-2">xp_afx edition</span>
            <h2 class="brand-title m-0">MARVIN <span class="brand-yellow">GYM</span></h2>
            <small class="text-secondary">Portal de Miembros</small>
        </div>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-warning alert-dismissible fade show bg-dark text-warning border-warning" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="usuario" class="form-label text-light">Usuario (cédula, teléfono o nombre)</label>
                <input type="text" id="usuario" name="usuario" class="form-control bg-dark text-white border-secondary" placeholder="Ej: 28123456 / 04141234567 / Alfredo" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-light">Contraseña</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Ingresa tu clave" required>
                    <button class="btn btn-outline-warning" type="button" onclick="togglePass()">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn btn-yellow w-100 py-2 mb-3">INGRESAR</button>
        </form>

        <div class="text-center mt-3 pt-3 border-top border-secondary">
            <p class="mb-1 text-secondary">¿Eres nuevo socio?</p>
            <a href="/registro" class="brand-yellow text-decoration-none fw-bold">Regístrate aquí</a>
            <br>
            <a href="/recuperar" class="text-secondary" style="font-size:0.9rem;">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="text-center mt-4">
            <small style="font-size: 0.75rem; color: #888;">© 2025 Marvin Gym · Desarrollado por <b class="brand-yellow">xp_afx</b></small>
        </div>
    </div>
    <script>
    function togglePass() {
        var input = document.getElementById('password');
        input.type = input.type === 'password' ? 'text' : 'password';
    }
    </script>
</body>
</html>
