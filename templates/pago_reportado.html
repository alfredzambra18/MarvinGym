<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Reportado - MarvinGym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body text-center">
                <h3 class="card-title">¡Comprobante enviado!</h3>
                <p class="card-text">Tu reporte de pago fue registrado. Para agilizar la activación, notifica al administrador por WhatsApp.</p>
                <a href="{{ whatsapp_url }}" class="btn btn-success btn-lg" target="_blank">
                    <i class="bi bi-whatsapp"></i> Ir a WhatsApp
                </a>
                <a href="{{ url_for('perfil') }}" class="btn btn-secondary btn-lg ms-2">
                    Volver a mi perfil
                </a>
            </div>
        </div>
    </div>
</body>
</html>
